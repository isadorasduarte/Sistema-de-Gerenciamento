<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Funcionário</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f3f4f6;
    min-height:100vh;
}

.header{
    background:#2563eb;
    color:white;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.header-container{
    max-width:1200px;
    margin:auto;
    padding:15px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    font-size:32px;
}

.logo-area h1{
    font-size:22px;
    margin-bottom:3px;
}

.logo-area p{
    font-size:13px;
    opacity:.9;
}

.logout-btn{
    background:rgba(255,255,255,.2);
    border:none;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

.logout-btn:hover{
    background:rgba(255,255,255,.35);
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card-label{
    color:#666;
    font-size:14px;
}

.card h2{
    margin-top:10px;
    font-size:30px;
    color:#2563eb;
}

.card.green h2{
    color:#16a34a;
}

.pedidos{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.pedido{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.pedido-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:15px;
}

.pedido h3{
    color:#1f2937;
    margin-bottom:6px;
}

.pedido-info{
    color:#6b7280;
    font-size:14px;
}

.pedido-total{
    text-align:right;
}

.pedido-total small{
    display:block;
    color:#666;
}

.pedido-total strong{
    color:#2563eb;
    font-size:22px;
}

.itens{
    border-top:1px solid #e5e7eb;
    padding-top:15px;
}

.itens p{
    font-weight:bold;
    margin-bottom:8px;
    color:#374151;
}

.itens ul{
    padding-left:20px;
}

.itens li{
    margin-bottom:5px;
    color:#6b7280;
}

@media(max-width:768px){

    .header-container{
        flex-direction:column;
        gap:15px;
        text-align:center;
    }

    .pedido-top{
        flex-direction:column;
        gap:15px;
    }

    .pedido-total{
        text-align:left;
    }
}
</style>

</head>
<body>

<header class="header">
    <div class="header-container">

        <div class="logo-area">
            <img src="/img/logo.jpg" alt="Isamar" style="height:40px; width:auto;"/>

            <div>
                <h1>
                    Isamar -
                    <span th:text="${funcionario.nome}"></span>
                </h1>
                <p>Gerenciamento de Pedidos</p>
            </div>
        </div>

        <a th:href="@{/login}" href="/login" style="
            background:rgba(255,255,255,.2);
            border:none;
            color:white;
            padding:10px 18px;
            border-radius:8px;
            cursor:pointer;
            text-decoration:none;
            font-weight:bold;
            font-size:14px;
            transition:.3s;
            display:inline-flex;
            align-items:center;
            gap:8px;
        ">
            <i class="ti ti-logout" style="font-size:18px;"></i>
            Sair
        </a>
    </div>
</header>

<main class="container">

    <section class="cards">

        <div class="card">
            <span class="card-label">Total de Pedidos</span>
            <h2 th:text="${listaPedido != null ? listaPedido.size() : 0}"></h2>
        </div>

        <div class="card green">
            <span class="card-label">Faturamento Total</span>
            <h2 th:text="'R$ ' + ${#numbers.formatDecimal(faturamentoTotal, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</h2>
        </div>

    </section>

    <section class="pedidos">

        <div class="pedido" th:each="pedido : ${listaPedido}">

            <div class="pedido-top">

                <div>
                    <h3>
                        Pedido #
                        <span th:text="${pedido.idPedido}"></span>
                    </h3>

                    <div class="pedido-info">
                        <span th:text="${pedido.nomeCliente}"></span>
                        •
                        <span th:text="${#dates.format(pedido.dataPedido,'dd/MM/yyyy')}"></span>
                    </div>
                </div>

                <div class="pedido-total">
                    <small>Total</small>

                    <strong>
                        R$
                        <span th:text="${pedido.valorTotal}"></span>
                    </strong>
                </div>

            </div>

            <div class="itens">

                <p>Itens do Pedido:</p>

                <ul>
                    <li th:each="produto : ${pedido.produtos}"
                        th:text="${produto}">
                    </li>
                </ul>

            </div>

        </div>

    </section>

</main>

</body>
</html>
