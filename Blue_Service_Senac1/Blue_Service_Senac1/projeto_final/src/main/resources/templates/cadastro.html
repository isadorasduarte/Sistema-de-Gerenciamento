<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: 'Nunito', sans-serif;
      padding: 32px 24px;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 360px;
    }

    .logo-wrap img { max-width: 230px; height: auto; display: block; }

    .msg-sucesso {
      display: none;
      width: 100%;
      background: #f0fff4;
      border: 1.5px solid #9ae6b4;
      border-radius: 10px;
      padding: 12px 16px;
      color: #276749;
      font-size: .85rem;
      font-weight: 700;
      text-align: center;
    }
    .msg-sucesso.show { display: block; }

    form { width: 100%; display: flex; flex-direction: column; gap: 14px; }

    .field { display: flex; flex-direction: column; gap: 5px; }

    .field label {
      font-size: .82rem;
      font-weight: 700;
      color: #4a5568;
      letter-spacing: .4px;
    }

    .input-wrap { position: relative; }

    .input-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0aec0;
      pointer-events: none;
      width: 15px; height: 15px;
    }

    .input-wrap input {
      width: 100%;
      padding: 11px 12px 11px 36px;
      border: 1.8px solid #e2e8f0;
      border-radius: 10px;
      font-size: .92rem;
      font-family: 'Nunito', sans-serif;
      color: #1a2340;
      background: #f8fafd;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }

    .input-wrap input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.13);
      background: #fff;
    }

    .input-wrap input.error {
      border-color: #e53e3e;
      box-shadow: 0 0 0 3px rgba(229,62,62,.12);
    }

    .error-msg {
      display: none;
      color: #e53e3e;
      font-size: .76rem;
      font-weight: 600;
      padding-left: 3px;
    }
    .error-msg.show { display: block; }

    .btn-cadastrar {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: .97rem;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: .5px;
      margin-top: 4px;
      transition: background .2s, transform .1s, box-shadow .2s;
      box-shadow: 0 4px 14px rgba(37,99,235,.28);
    }
    .btn-cadastrar:hover { background: #1d4ed8; }
    .btn-cadastrar:active { transform: scale(.98); }

    .login-link {
      text-align: center;
      font-size: .85rem;
      color: #718096;
      font-weight: 600;
    }
    .login-link a {
      color: #2563eb;
      font-weight: 800;
      text-decoration: none;
    }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>

    <div class="msg-sucesso" id="msg-sucesso">✅ Cadastro realizado com sucesso! Redirecionando para o login...</div>

    <form th:action="@{/usuario/cadastrar}" method="post" onsubmit="return validar()">

      <div class="field">
        <label for="nome">Nome Completo</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo"/>
        </div>
        <span class="error-msg" id="nome-err">⚠ Por favor, informe seu nome completo.</span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input type="email" id="email" name="email" placeholder="Digite seu email" autocomplete="email"/>
        </div>
        <span class="error-msg" id="email-err">⚠ Por favor, informe seu email.</span>
      </div>

      <div class="field">
        <label for="cep">CEP</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9"/>
        </div>
        <span class="error-msg" id="cep-err">⚠ Por favor, informe seu CEP.</span>
      </div>

      <div class="field">
        <label for="cpf">CPF</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6"/>
          </svg>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14"/>
        </div>
        <span class="error-msg" id="cpf-err">⚠ Por favor, informe seu CPF.</span>
      </div>

      <div class="field">
        <label for="telefone">Telefone</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12 19.79 19.79 0 0 1 1.08 3.38 2 2 0 0 1 3.05 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 17z"/>
          </svg>
          <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15"/>
        </div>
        <span class="error-msg" id="telefone-err">⚠ Por favor, informe seu telefone.</span>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha"/>
        </div>
        <span class="error-msg" id="senha-err">⚠ Por favor, informe uma senha.</span>
      </div>

      <button type="submit" class="btn-cadastrar">Cadastrar</button>

      <p class="login-link">Já tem uma conta? <a th:href="@{/login}">Entrar</a></p>

    </form>

  </div>

  <script>
    
    if (window.location.search.includes('sucesso')) {
      const msg = document.getElementById('msg-sucesso');
      msg.classList.add('show');
      setTimeout(() => { window.location.href = '/login'; }, 3000);
    }

    
    document.getElementById('cep').addEventListener('input', function() {
      let v = this.value.replace(/\D/g, '').slice(0, 8);
      if (v.length > 5) v = v.slice(0,5) + '-' + v.slice(5);
      this.value = v;
    });

    
    document.getElementById('cpf').addEventListener('input', function() {
      let v = this.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 9) v = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9);
      else if (v.length > 6) v = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);
      else if (v.length > 3) v = v.slice(0,3)+'.'+v.slice(3);
      this.value = v;
    });

    
    document.getElementById('telefone').addEventListener('input', function() {
      let v = this.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 10) v = '('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);
      else if (v.length > 6) v = '('+v.slice(0,2)+') '+v.slice(2,6)+'-'+v.slice(6);
      else if (v.length > 2) v = '('+v.slice(0,2)+') '+v.slice(2);
      else if (v.length > 0) v = '('+v;
      this.value = v;
    });

    const campos = ['nome','email','cep','cpf','telefone','senha'];

    function validar() {
      let ok = true;
      campos.forEach(id => {
        const input = document.getElementById(id);
        const err = document.getElementById(id + '-err');
        if (!input.value.trim()) {
          input.classList.add('error');
          err.classList.add('show');
          ok = false;
        } else {
          input.classList.remove('error');
          err.classList.remove('show');
        }
      });
      return ok;
    }

    campos.forEach(id => {
      document.getElementById(id).addEventListener('input', function() {
        if (this.value.trim()) {
          this.classList.remove('error');
          document.getElementById(id + '-err').classList.remove('show');
        }
      });
    });
  </script>
